[alembic]
script_location = alembic
# PostgreSQL: set DB_PASSWORD env var and use ${DB_PASSWORD} via docker-compose
# For local dev with SQLite, ignore this URL; it's only for PostgreSQL migrations
# sqlalchemy.url = postgresql+asyncpg://kylin_secops:${DB_PASSWORD}@localhost:5432/kylin_secops
sqlalchemy.url = sqlite+aiosqlite:///./kylin_secops_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S