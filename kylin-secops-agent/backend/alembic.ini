[alembic]
script_location = alembic
# postgresql+asyncpg://kylin_secops:password@localhost:5432/kylin_secops
sqlalchemy.url = postgresql+asyncpg://kylin_secops:kylin_secops_2026@localhost:5432/kylin_secops

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S