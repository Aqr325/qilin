# Kylin Security Operations — Nginx Reverse Proxy Configuration
# 麒麟安全智能运维平台 Nginx 反向代理配置
# 适用于 麒麟V10 (KylinOS V10) + Nginx 1.20+
#
# 安装: cp this file to /etc/nginx/conf.d/kylin-secops.conf
#        nginx -t && systemctl reload nginx

upstream kylin_secops_api {
    # 本地 API 后端 (uvicorn)
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;

    # 如需多实例扩展:
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
    # server 127.0.0.1:8003;

    keepalive 64;
}

# ── 前端静态资源 ──
server {
    listen 443 ssl http2;
    server_name secops.company.com;

    # ── SSL 证书 (麒麟系统推荐使用国密SM2或RSA) ──
    ssl_certificate     /etc/nginx/ssl/secops.company.com.pem;
    ssl_certificate_key /etc/nginx/ssl/secops.company.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全头部 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://secops.company.com;" always;

    # ── 客户端限制 ──
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_timeout 60s;
    client_body_timeout 60s;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 前端 SPA 路由 ──
    root /opt/kylin-secops-api/frontend/dist;
    index index.html;

    # API 代理
    location /api/ {
        proxy_pass http://kylin_secops_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 限制 API 速率
        limit_req zone=api burst=20 nodelay;
    }

    # WebSocket 端点（Agent 连接）
    location /api/v1/ws/ {
        proxy_pass http://kylin_secops_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket 长连接
        proxy_buffering off;
    }

    # Swagger 文档
    location /docs {
        proxy_pass http://kylin_secops_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://kylin_secops_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端 SPA 路由（所有非 API 路径交给 Vue Router）
    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 静态资源缓存策略
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 拒绝访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }

    # 日志
    access_log /var/log/nginx/kylin-secops-access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/kylin-secops-error.log warn;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name secops.company.com;
    return 301 https://$host$request_uri;
}

# ── API 限流配置 ──
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
